name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The service worker must precache every game file for offline play.
      - name: Check offline cache list
        run: |
          missing=0
          for f in $(find src css -type f); do
            grep -q "'./$f'" sw.js || { echo "::error file=sw.js::$f is missing from ASSETS"; missing=1; }
          done
          exit $missing

      # Publish only what the browser needs: the page, styles, scripts and app files.
      - name: Collect site files
        run: |
          mkdir -p _site/docs
          cp -r index.html manifest.json sw.js icons css src _site/
          cp -r docs/screenshots _site/docs/
          # A new cache version per deploy, so installed apps pick up the update.
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
