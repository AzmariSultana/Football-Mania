<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Football Mania</title>
  <!-- Master emblem: a classic ball and the lime curve of a bent free kick
       ("Master every curve"). Every icon size is generated from this file. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#16294f"/>
      <stop offset="0.58" stop-color="#0a1328"/>
      <stop offset="1" stop-color="#04070e"/>
    </radialGradient>
    <radialGradient id="pitch" cx="50%" cy="104%" r="62%">
      <stop offset="0" stop-color="#2f8a3a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2f8a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="0.9" y2="0.2">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity="0.15"/>
      <stop offset="0.28" stop-color="#c6ff3d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e4ff96"/>
    </linearGradient>
    <radialGradient id="shade" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#cfd7e2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="70%" cy="74%" r="60%">
      <stop offset="0.45" stop-color="#060b17" stop-opacity="0"/>
      <stop offset="1" stop-color="#060b17" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="ballClip"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#pitch)"/>

  <!-- the curve: a tapered lime trail bending into the ball, with a soft glow -->
  <path d="M40 474C90 334 172 238 300 220C186 272 124 362 116 482Z" fill="#c6ff3d" opacity="0.55" filter="url(#soft)"/>
  <path d="M40 474C90 334 172 238 300 220C186 272 124 362 116 482Z" fill="url(#curve)"/>

  <!-- ball shadow -->
  <ellipse cx="312" cy="356" rx="104" ry="18" fill="#000" opacity="0.28" filter="url(#soft)"/>

  <!-- the ball (same drawing as the splash ball, 64-unit space) -->
  <g transform="translate(304 210) scale(4.15) translate(-32 -32)">
    <circle cx="32" cy="32" r="30" fill="url(#shade)"/>
    <g clip-path="url(#ballClip)" fill="#0b1428">
      <path d="M32 20l11.4 8.3-4.4 13.4H25l-4.4-13.4z"/>
      <path d="M32 1.2l6.2 4.6-2.4 7.2h-7.6l-2.4-7.2z"/>
      <path d="M61.6 25.4l-1.6 7.8-7.2 1-3.1-7 5-5.6z"/>
      <path d="M51.6 56.8l-7.4 1.6-3.1-6.8 4.6-5.9 7.2 2z"/>
      <path d="M19.8 58.4l-7.4-1.6-1.3-9 7.2-2 4.6 5.9z"/>
      <path d="M2.4 25.4l6.9-4.2 5 5.6-3.1 7-7.2-1z"/>
    </g>
    <g stroke="#0b1428" stroke-width="1.1" stroke-linecap="round" opacity="0.75" fill="none">
      <path d="M32 20V13M43.4 28.3l6.3-1.3M39 41.7l3.6 4.3M25 41.7l-3.6 4.3M20.6 28.3l-6.3-1.3"/>
    </g>
    <circle cx="32" cy="32" r="30" fill="url(#shadow)"/>
    <ellipse cx="21" cy="14" rx="7.5" ry="4" fill="#fff" opacity="0.35" transform="rotate(-28 21 14)"/>
    <circle cx="32" cy="32" r="29.4" fill="none" stroke="#0b1428" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>
</svg>
